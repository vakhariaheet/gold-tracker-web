<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0A0908"/>
  <!-- Subtle gold border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#C29C44" stroke-width="1" opacity="0.45"/>
  <!-- K letterform using paths (vertical stroke + diagonal strokes) -->
  <!-- Vertical bar -->
  <rect x="8" y="7" width="2.5" height="18" rx="1" fill="#C29C44"/>
  <!-- Upper diagonal (top-right) -->
  <polygon points="10.5,16 20,7 22.5,7 13,16.5" fill="#C29C44"/>
  <!-- Lower diagonal (bottom-right) -->
  <polygon points="10.5,16 13,15.5 22.5,25 20,25" fill="#C29C44"/>
</svg>
