<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: safe zone is inner 80% (51px padding each side) -->
  <rect width="512" height="512" fill="#0A0908"/>
  <rect x="4" y="4" width="504" height="504" rx="8" fill="none" stroke="#C29C44" stroke-width="3" opacity="0.3"/>
  <!-- K vertical bar (within safe zone) -->
  <rect x="140" y="120" width="42" height="272" rx="12" fill="#C29C44"/>
  <!-- K upper arm -->
  <polygon points="182,256 320,120 368,120 224,262" fill="#C29C44"/>
  <!-- K lower arm -->
  <polygon points="182,256 224,250 368,392 320,392" fill="#C29C44"/>
  <!-- Subtle gold glow effect -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C29C44" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#C29C44" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#glow)"/>
</svg>
